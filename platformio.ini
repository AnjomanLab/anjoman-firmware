[platformio]
default_envs = r2

; ==============================================================================
; COMMON SETTINGS
; ==============================================================================
[env]
platform = espressif32@7.1.3
framework = arduino
monitor_speed = 460800
monitor_filters = direct, time, esp32_exception_decoder
lib_ldf_mode = chain+
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -O2

; ==============================================================================
; ROBOT 2: ESP32-S3-WROOM-1-N16R8 (16MB Flash QIO, 8MB Octal-PSRAM OPI)
; ==============================================================================
[env:r2]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_src_filter = +<*> -<gateway.cpp>
build_flags =
    ${env.build_flags}
    -D ROBOT_ID=2
    -D BOARD_HAS_PSRAM

; ==============================================================================
; ROBOT 3: ESP32-S3-WROOM-1-N16R8 (16MB Flash QIO, 8MB Octal-PSRAM OPI)
; ==============================================================================
[env:r3]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_src_filter = +<*> -<gateway.cpp>
build_flags =
    ${env.build_flags}
    -D ROBOT_ID=3
    -D BOARD_HAS_PSRAM

; ==============================================================================
; ROBOT 4: ESP32-S3-WROOM-1-N16R8 (16MB Flash QIO, 8MB Octal-PSRAM OPI)
; ==============================================================================
[env:r4]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_src_filter = +<*> -<gateway.cpp>
build_flags =
    ${env.build_flags}
    -D ROBOT_ID=4
    -D BOARD_HAS_PSRAM

; ==============================================================================
; GATEWAY (R1): ESP-NOW listener, no UWB, no motor control
; ==============================================================================
; This build only compiles src/gateway.cpp. UWB, motors, encoders, and
; state estimation are all omitted. Use for online data collection via
; USB serial from R1 acting as an ESP-NOW receiver.
; ==============================================================================
[env:gateway]
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_qspi
build_src_filter = +<*> -<main.cpp>
build_flags =
    ${env.build_flags}
    -D ROBOT_ID=1
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
