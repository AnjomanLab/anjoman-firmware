[platformio]
default_envs = r2

[env]
platform = espressif32@7.1.3
framework = arduino
monitor_speed = 460800
monitor_filters = direct, time, esp32_exception_decoder
lib_ldf_mode = deep+
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -O2
    -I${PROJECT_DIR}/lib/AnjomanConfig/src
    -I${PROJECT_DIR}/lib/AnjomanCommon/src
    -I${PROJECT_DIR}/lib/AnjomanTDMA/src
    -I${PROJECT_DIR}/lib/AnjomanStateEstimation/src
    -I${PROJECT_DIR}/lib/AnjomanFormation/src
    -I${PROJECT_DIR}/lib/AnjomanLogging/src
    -I${PROJECT_DIR}/lib/AnjomanI2C/src
    -I${PROJECT_DIR}/lib/Comms/src
    -I${PROJECT_DIR}/lib/BMI160_Custom/src
    -I${PROJECT_DIR}/lib/INA226_Custom/src
    -I${PROJECT_DIR}/lib/MagneticEncoder/src
    -I${PROJECT_DIR}/lib/MotorController/src

[env:r2]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_src_filter = +<*> -<gateway.cpp>
build_flags =
    ${env.build_flags}
    -D ROBOT_ID=2
    -D BOARD_HAS_PSRAM

[env:r3]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_src_filter = +<*> -<gateway.cpp>
build_flags =
    ${env.build_flags}
    -D ROBOT_ID=3
    -D BOARD_HAS_PSRAM

[env:r4]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_src_filter = +<*> -<gateway.cpp>
build_flags =
    ${env.build_flags}
    -D ROBOT_ID=4
    -D BOARD_HAS_PSRAM

[env:gateway]
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_qspi
build_src_filter = +<*> -<main.cpp>
build_flags =
    ${env.build_flags}
    -D ROBOT_ID=1
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
